name: Gemini Code Review

on:
  pull_request:
    branches:
      - production
      - develop
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read additional review prompts
        id: read-prompts
        run: |
          PROMPT_FILE=".github/claude-review.md"
          MAX_SIZE=4096  # Limit to 4KB to prevent prompt overflow
          if [ -f "$PROMPT_FILE" ]; then
            FILE_SIZE=$(wc -c < "$PROMPT_FILE")
            if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
              echo "::error::claude-review.md exceeds ${MAX_SIZE} bytes (${FILE_SIZE} bytes). Please reduce file size to prevent instructions being cut off."
              exit 1
            fi
            DELIMITER="GHOUTPUT_$(openssl rand -hex 8)"
            while grep -qF "$DELIMITER" "$PROMPT_FILE" 2>/dev/null; do
              DELIMITER="GHOUTPUT_$(openssl rand -hex 8)"
            done
            echo "extra_prompt<<${DELIMITER}" >> $GITHUB_OUTPUT
            cat "$PROMPT_FILE" >> $GITHUB_OUTPUT
            echo "${DELIMITER}" >> $GITHUB_OUTPUT
          else
            # No custom prompts file found - continue with default prompts only
            echo "extra_prompt=" >> $GITHUB_OUTPUT
          fi

      - name: Get PR diff
        id: get-diff
        run: |
          # Get the diff between base and head
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

          # Verify diff was generated
          if [ ! -f pr_diff.txt ]; then
            echo "::error::Failed to generate diff file"
            exit 1
          fi

          # Truncate if too large (Gemini has token limits)
          # Use 50KB limit to stay well under GITHUB_OUTPUT limits
          # Truncate by lines to avoid splitting multi-byte UTF-8 characters
          if [ "$(wc -c < pr_diff.txt)" -gt 50000 ]; then
            echo "::warning::Diff truncated for Gemini review (keeping ~50KB)"
            # Count lines that fit within ~50KB, truncate by complete lines
            LINES_TO_KEEP=$(head -c 50000 pr_diff.txt | wc -l)
            head -n "$LINES_TO_KEEP" pr_diff.txt > pr_diff_truncated.txt
          else
            cp pr_diff.txt pr_diff_truncated.txt
          fi

          # Get changed files list
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

          # Store content as outputs using unique delimiters to prevent injection
          # Generate random delimiter and ensure it doesn't appear in file content
          DELIMITER="GHOUTPUT_$(openssl rand -hex 8)"
          ATTEMPTS=0
          MAX_ATTEMPTS=10
          while grep -qF "$DELIMITER" pr_diff_truncated.txt 2>/dev/null || grep -qF "$DELIMITER" changed_files.txt 2>/dev/null; do
            ATTEMPTS=$((ATTEMPTS + 1))
            if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Failed to generate unique delimiter after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            DELIMITER="GHOUTPUT_$(openssl rand -hex 8)"
          done

          echo "changed_files<<${DELIMITER}" >> $GITHUB_OUTPUT
          cat changed_files.txt >> $GITHUB_OUTPUT
          echo "${DELIMITER}" >> $GITHUB_OUTPUT

          # For diff content, ensure proper newline handling
          echo "diff_content<<${DELIMITER}" >> $GITHUB_OUTPUT
          cat pr_diff_truncated.txt >> $GITHUB_OUTPUT
          # Ensure delimiter is on its own line
          printf "\n%s\n" "${DELIMITER}" >> $GITHUB_OUTPUT

      - name: Run Gemini Code Review
        id: gemini-review
        continue-on-error: true  # Informational only - don't fail PR on API errors
        uses: google-github-actions/run-gemini-cli@v0
        env:
          # The CLI refuses headless runs in untrusted directories, which made
          # every review come back "unavailable"
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: "gemini-3-flash-preview"
          prompt: |
            Please review this pull request with a focus on CODE SECURITY and PERFORMANCE.

            Specifically analyze:
            1. Security vulnerabilities (injection attacks, XSS, CSRF, authentication/authorization issues)
            2. Input validation and sanitization
            3. Performance bottlenecks and optimization opportunities
            4. Resource leaks and memory management
            5. Error handling and edge cases
            6. Race conditions and concurrency issues
            7. Secrets or credentials exposure
            8. API security best practices

            Be concise but thorough. Focus on actionable security and performance feedback.

            At the end, provide a clear "Security & Performance Assessment" section with:
            - Risk level (Low/Medium/High/Critical)
            - Summary of findings
            - Recommended actions

            ${{ steps.read-prompts.outputs.extra_prompt }}

            Here are the changed files:
            ${{ steps.get-diff.outputs.changed_files }}

            Here is the diff:
            ${{ steps.get-diff.outputs.diff_content }}

      - name: Post Review Comment
        if: always()
        uses: actions/github-script@v7
        env:
          GEMINI_OUTPUT: ${{ steps.gemini-review.outputs.output }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Get the output from environment variable to avoid injection issues
            const geminiOutput = process.env.GEMINI_OUTPUT || '';

            // Get the workflow run URL
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Sanitize the output to prevent XSS/injection in GitHub comments
            function sanitizeForGitHubComment(text) {
              if (!text) return '';
              // Limit length first to prevent DoS on regex operations
              let sanitized = text.substring(0, 65000);
              // Remove dangerous HTML tags (simple patterns to avoid ReDoS)
              sanitized = sanitized.replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '[script removed]');
              sanitized = sanitized.replace(/<script[^>]*>/gi, '[script removed]');
              sanitized = sanitized.replace(/<\/script>/gi, '');
              sanitized = sanitized.replace(/<iframe[^>]*>/gi, '[iframe removed]');
              sanitized = sanitized.replace(/<object[^>]*>/gi, '[object removed]');
              sanitized = sanitized.replace(/<embed[^>]*>/gi, '[embed removed]');
              sanitized = sanitized.replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '[style removed]');
              sanitized = sanitized.replace(/<link[^>]*>/gi, '[link removed]');
              // Remove on* event handlers
              sanitized = sanitized.replace(/\s+on\w+\s*=/gi, ' data-removed=');
              return sanitized;
            }

            let reviewText = sanitizeForGitHubComment(geminiOutput);
            if (!reviewText || !reviewText.trim()) {
              core.warning('Gemini review output is empty (informational only)');
              reviewText = 'Gemini review unavailable - see workflow logs for details.';
            }

            // Post as PR comment
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## Gemini Security & Performance Review\n\n${reviewText}\n\n---\n*Automated security review by Google Gemini (informational)* | [View full review details](${runUrl})`
              });
              console.log('Posted Gemini review comment to PR');
            } catch (error) {
              core.warning(`Failed to post review comment: ${error.message}`);
            }
